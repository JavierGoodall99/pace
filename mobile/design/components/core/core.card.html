<!-- @dsCard group="Components" viewport="700x640" name="Core Primitives" subtitle="Button, IconButton, Chip, SegmentedControl, Input, Badge, ProgressBar, Card, Avatar, Modal" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-ink);padding:24px;font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:20px}h4{color:var(--color-fog);font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;margin:0 0 10px}</style>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Button, IconButton, Chip, SegmentedControl, Input, Badge, ProgressBar, Card, Avatar, Modal } = window.PaceDesignSystem_1f19d6;
const Icon = ({d}) => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:d}}/>;
const heart = '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>';
const chevron = '<path d="m15 18-6-6 6-6"/>';
function App(){
  const [gender,setGender] = React.useState("WOMAN");
  const [sel,setSel] = React.useState(true);
  return <div>
    <h4>Buttons</h4>
    <div className="row"><Button>Get Early Access</Button><Button variant="secondary" size="sm">Log In</Button><Button variant="ghost" disabled>Continue</Button><IconButton ariaLabel="back"><Icon d={chevron}/></IconButton><IconButton tone="accent" ariaLabel="like"><Icon d={heart}/></IconButton></div>
    <h4>Selection</h4>
    <div className="row"><Chip selected={sel} onClick={()=>setSel(!sel)}>Running</Chip><Chip>Cycling</Chip><SegmentedControl options={["MAN","WOMAN","NON-BINARY"]} value={gender} onChange={setGender}/></div>
    <h4>Form &amp; Feedback</h4>
    <div className="row"><Input placeholder="YOUR@EMAIL.COM" style={{maxWidth:220}}/><Badge tone="accent" dot>Batch 01</Badge><Badge>Waitlist</Badge><ProgressBar value={3} max={8}/></div>
    <h4>Card &amp; Avatar</h4>
    <div className="row">
      <Card style={{padding:20,width:260}}><div style={{fontFamily:"var(--font-display)",fontSize:22,color:"var(--color-bone)",textTransform:"uppercase"}}>Born from the run club</div></Card>
      <Avatar src="https://images.pexels.com/photos/9944394/pexels-photo-9944394.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=200&w=200" size={56}/>
      <Avatar src="https://images.pexels.com/photos/10545425/pexels-photo-10545425.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=200&w=200" size={56} overlap/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
